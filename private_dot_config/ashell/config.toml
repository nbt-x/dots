[modules]
left = [ "Settings" ]
center = [ "Workspaces" ]
right = [ "WindowTitle" ]

[window_title]
truncate_title_after_length = 60

[workspaces]
workspace_names = ["Y","U","I","O","P","1","2","3","4","5",]
visibility_mode = "MonitorSpecific"

[appearance]
font_name = "Jet Brains Mono"
style = "Solid"
opacity = 1

workspace_colors = [ "#b4befe" ]
special_workspace_colors = [ "#94e2d5"]

[appearance.primary_color]
base = "#b4befe"
text = "#1e1e2e"

[appearance.danger_color]
base = "#f38ba8"
weak = "#f9e2af"

[appearance.background_color]
base = "#1e1e2e"
weak = "#313244"
strong = "#45475a"

[appearance.secondary_color]
base = "#11111b"
strong = "#1b1b25"


