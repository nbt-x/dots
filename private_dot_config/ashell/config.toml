[modules]
left = [ "Settings" ]
center = [ "Workspaces" ]
right = [ "WindowTitle" ]

[window_title]
truncate_title_after_length = 60

[settings]
remove_idle_btn = true
remove_airplane_btn = true
remove_charge_limit_btn = true

[workspaces]
visibility_mode = "MonitorSpecific"

[appearance]
font_name = "JetBrainsMono Nerd Font"

success_color = "#a6e3a1"
warning_color = "#f9e2af"
danger_color = "#f38ba8"
text_color = "#cdd6f4"

workspace_colors = [ "#fab387", "#b4befe", "#cba6f7" ]

[appearance.bar]
surface = "solid"

[appearance.opacity]
default = 0.8
bar = 1.0             # opaque, so it stays readable over the wallpaper
menu = 0.8            # menus sit over arbitrary windows
osd = 0.6
notifications = 0.9

[appearance.primary_color]
base = "#cba6f7"
text = "#1e1e2e"

[appearance.background_color]
base = "#1e1e2e"
weak = "#313244"
strong = "#45475a"
