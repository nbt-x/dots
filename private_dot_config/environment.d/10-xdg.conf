# Read by the systemd --user manager at login, so it applies to D-Bus/systemd
# activated services (xdg-desktop-portal-*, Dolphin, etc.) as well as to the
# graphical session. Hyprland's `env =` only covers processes Hyprland spawns
# itself, which is why the portals came up without this and showed no apps.
#
# Arch installs the XDG menu as arch-applications.menu; without the prefix KDE
# finds no menu at all and the portal AppChooser / "Open With" lists stay empty.
XDG_MENU_PREFIX=arch-
